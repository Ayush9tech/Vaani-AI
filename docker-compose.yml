services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaani
      POSTGRES_USER: vaani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaani-local-only}
    volumes:
      - vaani_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaani -d vaani"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://vaani:${POSTGRES_PASSWORD:-vaani-local-only}@db:5432/vaani
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  vaani_data:
